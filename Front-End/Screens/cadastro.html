<!-- Pagina de cadastro - estatico-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AprendiZap - Cadastro</title>
    <link rel="stylesheet" href="../Styles/style.css">
</head>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Verdana, Geneva, Tahoma, sans-serif;
}
.alinhar{
    display: flex;
    flex-direction: column;
    align-items: center;
}
header{
    background-color: #00072C;
    width: 100%;
    display: flex;
    flex-direction: row;
    align-items: center;
    margin-bottom: 5%;
}

#cab{
    border-left: 1px snow solid; 
    color:snow;
    padding-left: 2%;
    font-size: 3vw;

}
body{
    max-width: 100vw;
    min-height: 100vh;
 
    
}
main {
    width: 90%;
    height: 100%;
    margin: 0 auto;
}

#linha{
    border-top: 1px black solid;
    width: 100%;

}
form {
    width: 50%;
    height: auto;
    margin: 5%;
    padding: 1%;
    border: 3px solid #123498;
    border-radius: 5px;
}
fieldset{
    padding-bottom: 1%;
    padding-left: 1%;
    padding-right: 1%;
    width: 90%;
    border-radius: 5px;
    border: 2px solid black;
    margin-top: 1%;
}
fieldset:hover{
    border: 5px solid #123498;
    transition: 0.3s;
}
legend{
    padding: 1%;
}
input{
    font-size: 1.2vw;
    width: 100%;
    background-color: rgba(0, 0, 0, 0);
    border: none;
    color: black;
    outline: none;

}
#bnt{
    background-color: #123498;
    color: snow;
    padding: 1%;
    border: none;
    box-shadow: 1px 1px 1px 1px black;
    text-shadow: 1px 1px 1px black;
    margin-top: 5%;
    width: 20%;
    font-size: 1.5vw;
    border-radius: 5px;
}
#bnt:hover{
    background-color: black;
    transition: 0.5s;
}
#links{
    margin-top: 3%;
    width: 100%;
    display: flex;
    justify-content: space-between;
}
footer p{
    position: relative;
    margin-bottom: 5%;
}
</style>
<body class="alinhar">
    <header>
        <img id="logo" src="../Assets/Logo-principal.png" alt="Logo AprendiZap">
        <h1 id="cab">Cadastro</h1>
    </header>
    <main class="alinhar">
        <h1>
            Criar cadastro
        </h1>
        <div id="linha"></div>
        <form action="./main.html" class="alinhar">
            <fieldset>
                <legend>Nome completo</legend>
                <input type="text" name="nome" autocomplete="name" placeholder="Nome completo" required>
            </fieldset>
            <fieldset>
                <legend>Digite o RA</legend>
                <input type="text" name="ra" inputmode="numeric" pattern="[0-9]+" oninput="this.value = this.value.replace(/[^0-9]/g, '')" placeholder="RA" required>
            </fieldset>
            <fieldset>
                <legend>E-mail</legend>
                <input type="email" name="email" autocomplete="email" placeholder="E-mail" required>
            </fieldset>
            <fieldset>
                <legend>Digite a senha</legend>
                <input type="password" name="senha" autocomplete="new-password" minlength="8" placeholder="Senha" required>
            </fieldset>
            <fieldset>
                <legend>Confirme a senha</legend>
                <input type="password" name="confirmar-senha" autocomplete="new-password" minlength="8" placeholder="Confirme a senha" required>
            </fieldset>
            <input id="bnt" type="submit" value="Cadastrar">
            <div id="links">
            <a href="./index.html">Já tem uma conta? Entrar</a>
            </div>
            
        </form>
        
    </main>
    <footer>
        <p>2026 -  © Grupo nota 10</p>
    </footer>
</body>
</html>
